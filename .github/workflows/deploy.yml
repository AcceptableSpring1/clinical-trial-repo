name: Clinical Trial GHA
run-name: New Code submitted
on:
  push:
    branches:
      - main
      - ecs
permissions:
  id-token: write
  contents: read   
jobs:
  NewImageCreation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Build Docker image
        run: docker build --platform linux/amd64 -t 538565434143.dkr.ecr.us-east-1.amazonaws.com/clinical-trial-assistant:latest .
      - name: Push to ECR
        run: docker push 538565434143.dkr.ecr.us-east-1.amazonaws.com/clinical-trial-assistant:latest
      - name: Install CDK CLI
        run: npm install -g aws-cdk
      - name: Install CDK Python dependencies
        working-directory: infrastructure
        run: pip install -r requirements.txt
      - name: CDK Synth
        working-directory: infrastructure
        run: cdk synth
      - name: CDK Deploy
        working-directory: infrastructure
        run: cdk deploy --require-approval never
      - name: Force ECS redeployment
        run: |
          CLUSTER=$(aws ecs list-clusters --region us-east-1 --query "clusterArns[0]" --output text | xargs basename)
          SERVICE=$(aws ecs list-services --cluster $CLUSTER --region us-east-1 --query "serviceArns[0]" --output text | xargs basename)
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment --region us-east-1
          